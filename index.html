<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sovereign Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Catch any runtime JS errors and display them on screen instead of a blank page
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('debug-error');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerText += '\n[JS ERROR]: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
        }
      });
    </script>
  </head>
  <body class="bg-black text-white select-none">
    <div id="debug-error" style="display:none; color:#ff4444; background:#0a0a0a; padding:20px; font-family:monospace; font-size:11px; z-index:9999; position:fixed; inset:0; overflow:auto; word-break:break-all;">
      ⚠️ Startup Error Caught:
    </div>
    <div id="root"></div>
    <script type="module" src="./src/index.jsx"></script>
  </body>
</html>
