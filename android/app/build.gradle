apply plugin: 'com.android.application'

android {
    namespace "com.sovereign.tools"
    compileSdk rootProject.hasProperty('compileSdkVersion') ? rootProject.getExtensionValue('compileSdkVersion') : 34

    defaultConfig {
        applicationId "com.sovereign.tools"
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.getExtensionValue('minSdkVersion') : 24
        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.getExtensionValue('targetSdkVersion') : 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    signingConfigs {
        release {
            storeFile file("sovereign-release.keystore")
            storePassword "sovereign123"
            keyAlias "sovereign"
            keyPassword "sovereign123"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    
    // RESTORED WEBKIT DEPENDENCY FOR PROXY ROUTING
    implementation "androidx.webkit:webkit:1.9.0"
    
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found")
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
}
