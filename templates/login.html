<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Tools - Login</title>
    <style>
        body { background: #0f0f11; color: #f0f0f0; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .card { background: #18181c; padding: 24px; border-radius: 12px; border: 1px solid #2a2a30; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        h1 { font-size: 20px; text-align: center; color: #00e676; margin-bottom: 4px; letter-spacing: 0.5px; }
        .motto { text-align: center; color: #8a8a93; font-size: 13px; font-style: italic; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #22222a; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #00e676; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
        .btn-alt { background: #2a2a30; color: #fff; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; text-align: center; }
        .error { background: #ff525222; color: #ff5252; border: 1px solid #ff5252; }
        .msg { background: #00e67622; color: #00e676; border: 1px solid #00e676; }
        .disclaimer { font-size: 11px; color: #666; border-top: 1px solid #222; padding-top: 12px; margin-top: 16px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sovereign Tools</h1>
        <div class="motto">"Digital Autonomy & Local Control"</div>

        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        {% if msg %}<div class="alert msg">{{ msg }}</div>{% endif %}

        <form action="/login" method="POST" id="auth-form">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
            <button type="submit" class="btn-alt" onclick="document.getElementById('auth-form').action='/register'">Create Account</button>
        </form>

        <div class="disclaimer">
            <strong>Security Protocol:</strong> All processing is performed locally on this device. 6 consecutive failed password attempts trigger an immediate hardware database purge.
        </div>
    </div>
</body>
</html>
