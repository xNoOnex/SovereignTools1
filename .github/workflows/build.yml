name: Build Sovereign Tools APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Vite Bundle
        run: |
          npm install
          npx vite build
          
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing after vite build!"
            exit 1
          fi

      - name: Sync Capacitor & Inject Assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          # Guarantee compiled dist files are inside native Android assets
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

          # Inject App Launcher Icons
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "public/sovereign_logo.jpg" ]; then
            convert public/sovereign_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert public/sovereign_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert public/sovereign_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert public/sovereign_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert public/sovereign_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            convert public/sovereign_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert public/sovereign_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert public/sovereign_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert public/sovereign_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert public/sovereign_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-tools-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
