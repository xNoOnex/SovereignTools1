name: Build Sovereign Tools APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Build React Frontend
        run: |
          npm install
          npm run build || npx vite build || npx react-scripts build || mkdir -p dist

      - name: Setup & Generate App Launcher Icons
        run: |
          npm install @capacitor/assets @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Generate Android launcher icons from sovereign_logo.jpg
          if [ -f "public/sovereign_logo.jpg" ]; then
            npx @capacitor/assets generate --android --iconSource public/sovereign_logo.jpg || true
          fi
          
          npx cap copy
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-tools-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
