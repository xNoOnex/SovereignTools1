name: Build Sovereign Tools APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup & Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Generate Capacitor configuration file
          cat << 'CFG' > capacitor.config.json
          {
            "appId": "com.sovereign.tools",
            "appName": "Sovereign Tools",
            "webDir": "templates",
            "bundledWebRuntime": false
          }
          CFG

          # Ensure templates web directory exists
          mkdir -p templates

          # Generate clean Android native wrapper on build server
          rm -rf android
          npx cap add android
          npx cap copy
          npx cap sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-tools-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
