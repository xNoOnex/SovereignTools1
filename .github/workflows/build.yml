name: Build Sovereign Tools APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Build React Frontend
        run: |
          npm install
          
          # Attempt build with standard tooling
          npm run build || npx vite build || true

          # Guarantee dist directory and index.html exist
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            if [ -f "public/index.html" ]; then cp public/index.html dist/; fi
            if [ -f "templates/index.html" ]; then cp templates/index.html dist/; fi
            if [ -f "index.html" ]; then cp index.html dist/; fi
          fi

          # Fallback HTML if index.html is still missing
          if [ ! -f "dist/index.html" ]; then
            cat << 'HTML' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Sovereign Tools</title>
          </head>
          <body>
            <div id="root"></div>
          </body>
          </html>
          HTML
          fi

          # Copy public assets into dist
          if [ -d "public" ]; then cp -r public/* dist/ || true; fi
          if [ -d "templates" ]; then cp -r templates/* dist/ || true; fi

      - name: Setup & Sync Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          npx cap copy
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-tools-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
