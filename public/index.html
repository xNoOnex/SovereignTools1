<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sovereignty Suite</title>
    <script>
      window.onerror = function(msg, url, line) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#110000;color:#ff3333;padding:20px;z-index:99999;font-family:monospace;font-size:12px;overflow:auto;box-sizing:border-box;';
        div.innerHTML = '<h3>⚠️ JavaScript Boot Error</h3><p><b>Error:</b> ' + msg + '</p><p><b>File:</b> ' + url + '</p><p><b>Line:</b> ' + line + '</p>';
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body style="margin: 0; background-color: #0a0a0a; color: #ffffff;">
    <div id="root"></div>
  </body>
</html>
